[project]
name = "foundry-reverse"
version = "0.1.0"
description = "Azure AI Foundry MCP Server reverse-engineered to run locally on Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "mcp[cli]>=1.8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
foundry-reverse = "foundry_reverse.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_reverse"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
